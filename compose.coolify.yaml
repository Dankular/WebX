services:
  webx:
    build:
      context: .
      dockerfile: Dockerfile.coolify
    restart: unless-stopped
    volumes:
    - images:/app/steam
    healthcheck:
      test:
      - CMD
      - curl
      - -kf
      - https://127.0.0.1:3000/
      interval: 15s
      timeout: 5s
      retries: 10
  proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.proxy
    restart: unless-stopped
    depends_on:
      webx:
        condition: service_healthy
volumes:
  images: {}
